[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "secrets-storage"
version = "1.0.0"
description = "Typed secret lookup from environment variables and HashiCorp Vault"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pavel Liashkov", email = "pavel.liashkov@protonmail.com" }]
keywords = ["secrets", "vault", "hashicorp-vault", "configuration"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["hvac>=2.3.0,<3.0.0"]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "requests-mock>=1.12.0",
  "ruff>=0.11.0",
  "types-hvac>=2.4.0.20260718",
]

[project.urls]
Changelog = "https://github.com/bigbag/secrets-storage/blob/main/CHANGELOG.md"
Homepage = "https://github.com/bigbag/secrets-storage"
Issues = "https://github.com/bigbag/secrets-storage/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/secrets_storage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config"
